plugins {
  id 'java'
  id 'application'
}

// Toolchain provisioning is disabled by the portable builder. Only its verified
// Temurin installation is eligible through the fixed Gradle installation path.
java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
    vendor = JvmVendorSpec.ADOPTIUM
  }
}
def nativeCompiler = javaToolchains.compilerFor(java.toolchain)
def nativeLauncher = javaToolchains.launcherFor(java.toolchain)
tasks.withType(JavaCompile).configureEach {
  javaCompiler = nativeCompiler
  options.release = 25
  options.encoding = 'UTF-8'
}
tasks.withType(Test).configureEach {
  javaLauncher = nativeLauncher
  useJUnit()
  maxParallelForks = 1
  maxHeapSize = '192m'
  jvmArgs '-XX:ActiveProcessorCount=2'
  jvmArgs '--enable-native-access=ALL-UNNAMED', '--illegal-native-access=deny'
}
tasks.withType(JavaExec).configureEach {
  javaLauncher = nativeLauncher
  jvmArgs '--enable-native-access=ALL-UNNAMED', '--illegal-native-access=deny'
}
tasks.withType(AbstractArchiveTask).configureEach {
  preserveFileTimestamps = false
  reproducibleFileOrder = true
}

if (providers.gradleProperty('nativeBuildRoot').isPresent()) {
  def outputRoot = new File(providers.gradleProperty('nativeBuildRoot').get())
  if (!outputRoot.isAbsolute()) {
    throw new GradleException('nativeBuildRoot must be absolute')
  }
  layout.buildDirectory = new File(outputRoot, 'protocol')
} else {
  layout.buildDirectory = file('../../.pi-tools/protocol-java-dist')
}
repositories { mavenCentral() }
dependencies {
  implementation('com.networknt:json-schema-validator:2.0.4') {
    exclude group: 'com.fasterxml.jackson.dataformat', module: 'jackson-dataformat-yaml'
    exclude group: 'com.ethlo.time', module: 'itu'
  }
  runtimeOnly 'org.slf4j:slf4j-nop:2.0.17'
  testImplementation 'junit:junit:4.13.2'
}
application {
  mainClass = 'org.apache.aurora.nativeprotocol.ProtocolTool'
  applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED', '--illegal-native-access=deny']
}
sourceSets.main.resources {
  srcDir '../native-v1alpha1'
  include 'schema.json'
}
tasks.named('test', Test) {
  systemProperty 'aurora.fixtures', file('../native-v1alpha1/fixtures').absolutePath
}
def protocolRuntime = configurations.runtimeClasspath
def runtimeManifest = layout.projectDirectory.file('runtime-dependencies.sha256')
def verifyRuntimeArtifacts = tasks.register('verifyRuntimeArtifacts') {
  inputs.files protocolRuntime
  inputs.file runtimeManifest
  doLast {
    def expected = [:]
    runtimeManifest.asFile.eachLine { line ->
      def fields = line.split(/\s+/, 2)
      expected[fields[1]] = fields[0]
    }
    def actual = [:]
    protocolRuntime.each { artifact ->
      actual[artifact.name] = java.security.MessageDigest.getInstance('SHA-256')
          .digest(artifact.bytes).encodeHex().toString()
    }
    if (actual != expected) {
      throw new GradleException('Native protocol runtime artifacts differ from reviewed SHA-256 manifest')
    }
  }
}
tasks.named('test') { dependsOn verifyRuntimeArtifacts }
tasks.named('installDist') { dependsOn verifyRuntimeArtifacts }

// Gate built runtime JARs before tests, then independently gate the actual
// installed lib directory. Exec tasks avoid removed project.exec APIs.
def boundaryTool = layout.projectDirectory.file('../../build-support/native/verify-boundary')
def nativeJar = tasks.named('jar', Jar)
def boundaryLib = layout.buildDirectory.dir('boundary/lib')
def runtimeReport = layout.buildDirectory.file('reports/native-runtime.json')
def installedReport = layout.buildDirectory.file('reports/installed-native-runtime.json')
def runtimeJars = configurations.runtimeClasspath

def stageBoundaryRuntime = tasks.register('stageBoundaryRuntime', Sync) {
  from runtimeJars
  from nativeJar.flatMap { it.archiveFile }
  into boundaryLib
}
def verifyNativeBoundary = tasks.register('verifyNativeBoundary', Exec) {
  dependsOn stageBoundaryRuntime
  inputs.file boundaryTool
  inputs.files runtimeJars, nativeJar.flatMap { it.archiveFile }
  commandLine 'python3', boundaryTool.asFile.absolutePath,
      '--lib-dir', boundaryLib.get().asFile.absolutePath,
      '--report', runtimeReport.get().asFile.absolutePath,
      '--profile', 'protocol'
}
def install = tasks.named('installDist', Sync)
def verifyInstalledNativeBoundary = tasks.register('verifyInstalledNativeBoundary', Exec) {
  dependsOn install
  onlyIf { install.get().state.failure == null }
  inputs.file boundaryTool
  commandLine 'python3', boundaryTool.asFile.absolutePath,
      '--lib-dir', install.map { new File(it.destinationDir, 'lib') }.get().absolutePath,
      '--report', installedReport.get().asFile.absolutePath,
      '--profile', 'protocol'
}
tasks.named('check') { dependsOn verifyNativeBoundary }
tasks.named('test') { dependsOn verifyNativeBoundary }
install.configure {
  dependsOn verifyNativeBoundary
  finalizedBy verifyInstalledNativeBoundary
}
