apply plugin: 'java'
apply plugin: 'application'

// Isolated from the legacy scheduler's forced Jackson versions until native wiring.
if (project.hasProperty('nativeBuildRoot')) {
  def outputRoot = new File(project.property('nativeBuildRoot').toString())
  if (!outputRoot.isAbsolute()) {
    throw new GradleException('nativeBuildRoot must be absolute')
  }
  buildDir = new File(outputRoot, 'protocol')
} else {
  buildDir = file('../../.pi-tools/protocol-java-dist')
}
sourceCompatibility = 1.8
targetCompatibility = 1.8
repositories { mavenCentral() }
dependencies {
  implementation('com.networknt:json-schema-validator:2.0.4') {
    exclude group: 'com.fasterxml.jackson.dataformat', module: 'jackson-dataformat-yaml'
    exclude group: 'com.ethlo.time', module: 'itu'
  }
  runtimeOnly 'org.slf4j:slf4j-nop:2.0.17'
  testImplementation 'junit:junit:4.13.2'
}
mainClassName = 'org.apache.aurora.nativeprotocol.ProtocolTool'
sourceSets.main.resources {
  srcDir '../native-v1alpha1'
  include 'schema.json'
}
test {
  maxParallelForks = 1
  systemProperty 'aurora.fixtures', file('../native-v1alpha1/fixtures').absolutePath
}

task verifyRuntimeArtifacts {
  inputs.files configurations.runtimeClasspath
  inputs.file 'runtime-dependencies.sha256'
  doLast {
    def expected = [:]
    file('runtime-dependencies.sha256').eachLine { line ->
      def fields = line.split(/\s+/, 2)
      expected[fields[1]] = fields[0]
    }
    def actual = [:]
    configurations.runtimeClasspath.each { artifact ->
      actual[artifact.name] = java.security.MessageDigest.getInstance('SHA-256')
          .digest(artifact.bytes).encodeHex().toString()
    }
    if (actual != expected) {
      throw new GradleException('Native protocol runtime artifacts differ from reviewed SHA-256 manifest')
    }
  }
}
test.dependsOn verifyRuntimeArtifacts
installDist.dependsOn verifyRuntimeArtifacts

// Verify built JAR contents before tests, and verify the actual copied lib directory
// at the end of installDist. Neither gate invokes the legacy root project.
def boundaryTool = file('../../build-support/native/verify-boundary')
task stageBoundaryRuntime(type: Sync, dependsOn: jar) {
  from configurations.runtimeClasspath
  from jar.archivePath
  into "$buildDir/boundary/lib"
}
task verifyNativeBoundary(type: Exec, dependsOn: stageBoundaryRuntime) {
  inputs.file boundaryTool
  inputs.files configurations.runtimeClasspath, jar.archivePath
  commandLine 'python3', boundaryTool.absolutePath,
      '--lib-dir', file("$buildDir/boundary/lib").absolutePath,
      '--report', file("$buildDir/reports/native-runtime.json").absolutePath,
      '--profile', 'protocol'
}
check.dependsOn verifyNativeBoundary
test.dependsOn verifyNativeBoundary
installDist.dependsOn verifyNativeBoundary
installDist.doLast {
  exec {
    commandLine 'python3', boundaryTool.absolutePath,
        '--lib-dir', new File(installDist.destinationDir, 'lib').absolutePath,
        '--report', file("$buildDir/reports/installed-native-runtime.json").absolutePath,
        '--profile', 'protocol'
  }
}
