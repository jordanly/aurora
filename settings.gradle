// Direct Gradle invocations must use the same reviewed Gradle release and Java 25+.
def pins = new groovy.json.JsonSlurper().parse(file('build-support/native/toolchains.json'))
if (gradle.gradleVersion != pins.tools.gradle.directory.substring('gradle-'.length())) {
  throw new GradleException('Use ./gradlew for the pinned Gradle release')
}
if (JavaVersion.current() < JavaVersion.VERSION_25) {
  throw new GradleException('The maintained build requires Java 25 or newer; use ./gradlew')
}
// Historical Mesos projects are retired; their build remains recoverable in Git.
rootProject.name = 'aurora'
include ':aurora-native-scheduler', ':protocol'
project(':aurora-native-scheduler').projectDir = file('scheduler/native')
project(':protocol').projectDir = file('protocol/java')
