// Register the benchmark source set before analyzer task creation.
sourceSets.create('jmh') {
  compileClasspath += sourceSets.main.output + sourceSets.test.output
  runtimeClasspath += sourceSets.main.output + sourceSets.test.output
}

// Run the original analyzer rules with Java 25-capable tools when requested.
def runCodeQuality = project.hasProperty('q')
tasks.withType(Checkstyle).configureEach { enabled = runCodeQuality }
tasks.withType(Pmd).configureEach { enabled = runCodeQuality }
checkstyle { toolVersion = '14.1.0' }
pmd {
  toolVersion = '7.27.0'
  ruleSets = []
  consoleOutput = true
}
def pmdRuleResources = tasks.register('preparePmdRules', Sync) {
  from('config/pmd') { into 'config/pmd' }
  into layout.buildDirectory.dir('pmd-rule-resources')
}
tasks.withType(Pmd).configureEach {
  pmdClasspath += files(pmdRuleResources)
}
tasks.named('pmdMain') { ruleSetFiles = files('config/pmd/common.xml', 'config/pmd/main.xml') }
tasks.named('pmdTest') { ruleSetFiles = files('config/pmd/common.xml', 'config/pmd/test.xml') }
tasks.named('pmdJmh') { ruleSetFiles = files('config/pmd/jmh.xml') }
configurations.create('spotbugs')
dependencies { spotbugs 'com.github.spotbugs:spotbugs:4.10.4' }
['main', 'test', 'jmh'].each { sourceName ->
  def sourceSet = sourceSets[sourceName]
  def reportFile = layout.buildDirectory.file("reports/spotbugs/${sourceName}.xml")
  def filterFile = file('config/spotbugs/excludeFilter.xml')
  def analysisClasses = sourceSet.output.classesDirs
  def auxiliaryClasses = sourceSet.compileClasspath
  tasks.register("spotbugs${sourceName.capitalize()}", JavaExec) {
    group = 'verification'
    dependsOn sourceSet.compileJavaTaskName
    classpath = configurations.spotbugs
    mainClass = 'edu.umd.cs.findbugs.LaunchAppropriateUI'
    maxHeapSize = '512m'
    inputs.files(analysisClasses, auxiliaryClasses, filterFile)
    outputs.file(reportFile)
    doFirst {
      reportFile.get().asFile.parentFile.mkdirs()
      args = ['-textui', '-effort:max', '-medium', '-exitcode', '-xml:withMessages',
          '-output', reportFile.get().asFile.absolutePath, '-exclude', filterFile.absolutePath,
          '-auxclasspath', auxiliaryClasses.asPath] + analysisClasses.files.collect { it.absolutePath }
    }
  }
}
['licenseMain', 'licenseTest'].each { taskName ->
  registerLicenseCheck(project, taskName, [file('src/main/java'), file('src/test/java')])
}
if (runCodeQuality) {
  tasks.named('check') { dependsOn 'spotbugsMain', 'spotbugsTest', 'spotbugsJmh', 'licenseMain', 'licenseTest' }
}

// Compile every original test class; Java compilation does not need the UI bundle.
tasks.named('compileTestJava') {
  classpath = files(sourceSets.main.output.classesDirs, configurations.testCompileClasspath)
}
tasks.register('processJavaResources', Copy) {
  from(sourceSets.main.resources) { exclude 'scheduler/assets/js/bundle.js*' }
  mustRunAfter project(':ui').tasks.named('webpack')
  from tasks.named('generateBuildProperties')
  into layout.buildDirectory.dir('java-resources')
}
tasks.register('focusedTest', Test) {
  description = 'Run selected original scheduler tests without UI or full-suite coverage gates.'
  group = 'verification'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = files(sourceSets.test.output, sourceSets.main.output.classesDirs,
      tasks.named('processJavaResources'), configurations.testRuntimeClasspath)
  jacoco.enabled = false
}

idea {
  project {
    vcs = 'Git'
    jdkName = '25'
    languageLevel = '25'

  }
}

// Modern IntelliJ imports this Gradle model directly. The old .ipr/.iml XML
// mutation APIs are deprecated in Gradle 9; generated API roots are mapped above.

// Configuration parameters for the application plugin.
application {
  applicationName = 'aurora-scheduler'
  mainClass = 'org.apache.aurora.scheduler.app.SchedulerMain'
}

jacoco { toolVersion = '0.8.14' }

def reportPath = "$buildDir/reports/jacoco/test"
jacocoTestReport {
  group = "Reporting"
  description = "Generate Jacoco coverage reports after running tests."

  sourceDirectories.from(sourceSets.main.java.srcDirs)
  classDirectories.from(sourceSets.main.output.classesDirs)
  reports {
    xml.required = true
  }
  doLast {
    println "Coverage report generated: file://$reportPath/html/index.html"
  }
}
test.finalizedBy jacocoTestReport

jacocoTestCoverageVerification {
  violationRules {
    rule {
      limit {
        counter = 'INSTRUCTION'
        minimum = 0.87
      }
    }
    rule {
      limit {
        counter = 'BRANCH'
        minimum = 0.79
      }
    }
  }
}
jacocoTestReport.finalizedBy jacocoTestCoverageVerification

// Qualify the complete original Java suite before backend extraction. Keep UI/distribution
// qualification in the full build, and retain focusedTest for selected, uninstrumented tests.
def behaviorTest = tasks.register('behaviorTest', Test) {
  description = 'Run all original scheduler Java tests with coverage, independently of UI packaging.'
  group = 'verification'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = files(sourceSets.test.output, sourceSets.main.output.classesDirs,
      tasks.named('processJavaResources'), configurations.testRuntimeClasspath)
  doFirst {
    if (!filter.commandLineIncludePatterns.empty || !filter.includePatterns.empty
        || !filter.excludePatterns.empty || !includes.empty || !excludes.empty) {
      throw new GradleException('behaviorTest requires the complete suite; use focusedTest for filters')
    }
  }
}

def behaviorCoverageReport = tasks.register('behaviorCoverageReport', JacocoReport) {
  description = 'Report coverage of the original application classes from behaviorTest.'
  group = 'verification'
  dependsOn behaviorTest
  executionData behaviorTest.map { it.jacoco.destinationFile }
  sourceDirectories.setFrom(sourceSets.main.java.srcDirs)
  classDirectories.setFrom(sourceSets.main.output.classesDirs)
  reports {
    xml.required = true
    html.required = true
  }
}

def behaviorCoverageVerification = tasks.register(
    'behaviorCoverageVerification', JacocoCoverageVerification) {
  description = 'Enforce the historical coverage thresholds on the original application.'
  group = 'verification'
  dependsOn behaviorCoverageReport
  executionData behaviorTest.map { it.jacoco.destinationFile }
  sourceDirectories.setFrom(sourceSets.main.java.srcDirs)
  classDirectories.setFrom(sourceSets.main.output.classesDirs)
  violationRules {
    rule {
      limit {
        counter = 'INSTRUCTION'
        minimum = 0.87
      }
      limit {
        counter = 'BRANCH'
        minimum = 0.79
      }
    }
  }
}

def commonsBehaviorTest = project(':commons').tasks.named('test')
tasks.register('verifyOriginalBehavior') {
  description = 'Run original Java behavior and commons suites and enforce application coverage.'
  group = 'verification'
  dependsOn behaviorCoverageVerification, commonsBehaviorTest
  doLast {
    def requiredTasks = [behaviorTest.get(), behaviorCoverageReport.get(),
        behaviorCoverageVerification.get(), commonsBehaviorTest.get()]
    requiredTasks.each { requiredTask ->
      def state = requiredTask.state
      if (!requiredTask.enabled || !state.executed
          || (state.skipped && !(state.skipMessage in ['UP-TO-DATE', 'FROM-CACHE']))) {
        throw new GradleException("Original behavior qualification requires ${requiredTask.path}; "
            + "it was excluded, disabled or skipped")
      }
    }
    // JaCoCo skips its task when execution data is absent; that must not pass this gate.
    def report = behaviorCoverageReport.get().reports.xml.outputLocation.get().asFile
    if (!behaviorTest.get().jacoco.destinationFile.isFile() || !report.isFile()) {
      throw new GradleException('Original behavior qualification requires coverage data and an XML report')
    }
  }
}

// Keep the complete original benchmark source set without the obsolete JMH plugin.
configurations.jmhImplementation.extendsFrom(configurations.testImplementation)
configurations.jmhRuntimeOnly.extendsFrom(configurations.testRuntimeOnly)
dependencies {
  jmhImplementation 'org.openjdk.jmh:jmh-core:1.15'
  jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.15'
}
tasks.register('jmh', JavaExec) {
  group = 'benchmark'
  classpath = sourceSets.jmh.runtimeClasspath
  mainClass = 'org.openjdk.jmh.Main'
  maxHeapSize = '512m'
  doFirst { layout.buildDirectory.dir('reports/jmh').get().asFile.mkdirs() }
  args '-prof', 'gc', '-prof', 'stack'
  args '-o', layout.buildDirectory.file('reports/jmh/human.txt').get().asFile.path
  if (project.hasProperty('benchmarks')) { args project.property('benchmarks') }
  args '-rff', layout.buildDirectory.file('reports/jmh/results.txt').get().asFile.path
}

run {
  mainClass = 'org.apache.aurora.scheduler.app.local.LocalSchedulerMain'
  classpath += sourceSets.test.output
}

startScripts {
  outputDir = layout.buildDirectory.dir('scheduler-scripts').get().asFile
  def environmentClasspathPrefix = System.env.CLASSPATH_PREFIX

  if (!environmentClasspathPrefix?.trim()) {
    return
  }

  doLast {
    unixScript.text = unixScript.text.replace('CLASSPATH=', "CLASSPATH=${environmentClasspathPrefix}:")
  }
}

// Include a script to run the recovery tool.
task moreStartScripts(type: CreateStartScripts) {
  mainClass = 'org.apache.aurora.scheduler.storage.durability.RecoveryTool'
  applicationName = 'recovery-tool'
  outputDir = layout.buildDirectory.dir('recovery-scripts').get().asFile
  classpath = jar.outputs.files + project.configurations.runtimeClasspath
}

distributions.main.contents.into('bin') {
  from(moreStartScripts)
  filePermissions { unix(0755) }
}

// Execute both installed original entrypoints on the pinned runtime, without starting services.
tasks.register('verifyInstalledDistribution', Exec) {
  group = 'verification'
  description = 'Verify packaged Java/UI artifacts and original scheduler/recovery launchers.'
  def installed = tasks.named('installDist')
  def checker = file('build-support/java/verify-distribution.py')
  def receipt = layout.buildDirectory.file('distribution-verification.json')
  dependsOn installed
  inputs.file(checker)
  inputs.dir(installed.map { it.destinationDir })
  outputs.file(receipt)
  outputs.upToDateWhen { false }
  commandLine 'python3', checker.absolutePath,
      installed.get().destinationDir.absolutePath, '--receipt', receipt.get().asFile.absolutePath
}

// Gradle supplies logging to its PMD worker and excludes it from the PMD configuration.
// The standalone source-launcher fixture needs PMD's declared logging API explicitly.
configurations.create('pmdFixtureSupport')
dependencies {
  pmdFixtureSupport 'org.slf4j:slf4j-simple:1.7.36'
  pmdFixtureSupport 'junit:junit:4.12'
}
def pmdFixtureClasspath = configurations.pmd + configurations.pmdFixtureSupport +
    sourceSets.test.compileClasspath
tasks.register('verifyPmdMigration', Exec) {
  group = 'verification'
  description = 'Verify historical PMD rule mappings against positive and negative Java fixtures.'
  def fixture = file('build-support/java/PmdMigrationFixtures.java')
  inputs.files(fileTree('config/pmd'), fixture, pmdFixtureClasspath)
  workingDir rootDir
  doFirst {
    commandLine new File(System.getProperty('java.home'), 'bin/java').absolutePath,
        '-cp', pmdFixtureClasspath.asPath, fixture.absolutePath
  }
}

tasks.register('verifyOriginalQuality') {
  group = 'verification'
  description = 'Run every original Java quality gate explicitly; requires -Pq.'
  dependsOn 'checkstyleMain', 'checkstyleTest', 'pmdMain', 'pmdTest',
      'spotbugsMain', 'spotbugsTest', 'licenseMain', 'licenseTest',
      ':commons:licenseMain', ':commons:licenseTest', 'verifyPmdMigration'
  doLast {
    if (!runCodeQuality) {
      throw new GradleException('verifyOriginalQuality requires -Pq to enable all analyzer gates')
    }
  }
}
if (runCodeQuality) {
  tasks.named('check') { dependsOn 'verifyPmdMigration' }
}

// Keep the old analyzer only as a comparison oracle for migration fixtures.
configurations.create('checkstyleLegacy')
configurations.create('checkstyleFixtureSupport')
dependencies {
  checkstyleLegacy 'com.puppycrawl.tools:checkstyle:7.3'
  checkstyleLegacy 'commons-cli:commons-cli:1.3.1'
  checkstyleLegacy 'commons-logging:commons-logging:1.2'
  checkstyleLegacy 'antlr:antlr:2.7.7'
  // Gradle's worker supplies this dependency; the standalone CLI fixture needs its own copy.
  checkstyleFixtureSupport 'commons-logging:commons-logging:1.2'
}
def checkstyleFixtureClasspath = configurations.checkstyle + configurations.checkstyleFixtureSupport
tasks.register('verifyCheckstyleMigration', Exec) {
  group = 'verification'
  def fixture = file('config/checkstyle/verify-migration.py')
  def receipt = layout.buildDirectory.file('reports/checkstyle/migration-fixtures.json')
  inputs.files(fileTree('config/checkstyle'), configurations.checkstyleLegacy,
      checkstyleFixtureClasspath)
  outputs.file(receipt)
  workingDir rootDir
  doFirst {
    commandLine 'python3', fixture.absolutePath,
        '--java', new File(System.getProperty('java.home'), 'bin/java').absolutePath,
        '--old-classpath', configurations.checkstyleLegacy.asPath,
        '--new-classpath', checkstyleFixtureClasspath.asPath,
        '--receipt', receipt.get().asFile.absolutePath
  }
}
tasks.register('verifySpotBugsMigration', Exec) {
  group = 'verification'
  def fixture = file('build-support/java/SpotBugsMigrationFixtures.java')
  inputs.files(fileTree('config/spotbugs'), configurations.spotbugs, fixture)
  workingDir rootDir
  doFirst {
    commandLine new File(System.getProperty('java.home'), 'bin/java').absolutePath,
        '-cp', configurations.spotbugs.asPath, fixture.absolutePath
  }
}
tasks.named('verifyOriginalQuality') {
  dependsOn 'verifyCheckstyleMigration', 'verifySpotBugsMigration'
}
if (runCodeQuality) {
  tasks.named('check') { dependsOn 'verifyCheckstyleMigration', 'verifySpotBugsMigration' }
}

// The historical optional checks covered all source sets, including benchmarks.
def requiredQualityTasks = [
    'checkstyleMain', 'checkstyleTest', 'checkstyleJmh', 'pmdMain', 'pmdTest', 'pmdJmh',
    'spotbugsMain', 'spotbugsTest', 'spotbugsJmh', 'licenseMain', 'licenseTest',
    'verifyCheckstyleMigration', 'verifyPmdMigration', 'verifySpotBugsMigration'
].collect { tasks.named(it) } + [
    project(':commons').tasks.named('licenseMain'),
    project(':commons').tasks.named('licenseTest')
]
tasks.named('verifyOriginalQuality') {
  dependsOn requiredQualityTasks
  doLast {
    requiredQualityTasks.each { provider ->
      def requiredTask = provider.get()
      def state = requiredTask.state
      if (!requiredTask.enabled || !state.executed
          || (state.skipped && !(state.skipMessage in ['UP-TO-DATE', 'FROM-CACHE']))) {
        throw new GradleException("Original quality qualification requires ${requiredTask.path}; "
            + 'it was excluded, disabled or skipped')
      }
    }
  }
}
