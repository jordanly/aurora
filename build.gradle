apply plugin: 'application'
apply plugin: 'checkstyle'
apply plugin: 'jacoco'
apply plugin: 'pmd'

def minJavaVersion = JavaVersion.VERSION_25;

allprojects {
  apply plugin: 'java-library'
  apply plugin: 'idea'
  apply plugin: 'maven-publish'
  apply plugin: 'project-report'

  layout.buildDirectory = rootProject.file(
      "${rootProject.findProperty('auroraBuildRoot') ?: '.cache/inplace-build/build'}/${project == rootProject ? 'scheduler' : project.name}")

  repositories {
    mavenCentral()
  }

  java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
  }
  tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
  }
  tasks.withType(Test).configureEach {
    useJUnit()
    maxParallelForks = 1
    maxHeapSize = '512m'
  }

  group = 'org.apache.aurora'
  version = file("${rootDir}/.auroraversion").text.trim().toUpperCase()
  if (version.contains('/')) {
    throw new GradleException('''
*******************************************************************************
The application version string read by gradle is invalid.  This is known to
happen when building on Windows, or within vagrant with a Windows host.
You can work around this issue by cloning git _within_ vagrant and building
from there.

For more details, please see https://issues.apache.org/jira/browse/AURORA-1169
*******************************************************************************
''')
  }

  task sourceJar(type: Jar) {
    from sourceSets.main.allJava
  }

  if (project.hasProperty('internalMavenUrl')) {
    publishing {
      repositories {
        maven {
          credentials {
            username = internalMavenUser
            password = internalMavenPass
          }
          url internalMavenUrl
        }
      }
    }
  }

  ext.commonsLangRev = '2.6'
  ext.curatorRev = '2.12.0'
  ext.gsonRev = '2.3.1'
  // Guice 6 retains javax APIs; use the Guava version in its published parent POM.
  ext.guavaRev = '31.0.1-jre'
  ext.guiceRev = '6.0.0'
  ext.httpclientRev = '4.5.2'
  ext.httpcoreRev = '4.4.4'
  ext.asyncHttpclientRev = '2.0.37'
  ext.jacksonRev = '2.5.1'
  ext.jaxRsRev = '2.0'
  ext.junitRev = '4.12'
  ext.logbackRev = '1.2.3'
  ext.nettyRev = '4.0.52.Final'
  ext.protobufRev = '3.5.1'
  ext.resteasyRev = '3.1.4.Final'
  ext.servletRev = '3.1.0'
  ext.slf4jRev = '1.7.25'
  ext.stringTemplateRev = '3.2.1'
  ext.thriftRev = '0.10.0'
  ext.zookeeperRev = '3.4.8'

  configurations.all {
    exclude module: 'junit-dep'
    // Multibindings has been part of Guice core since 4.2.
    exclude group: 'com.google.inject.extensions', module: 'guice-multibindings'
    // We use logback, so we do not want to pull in log4j artifacts.
    exclude module: 'log4j'
    exclude module: 'slf4j-log4j12'

    // ResolutionStrategy needs to be set in the allprojects block otherwise dependent projects
    // will not inherit it. Note that dependencies still need to be specified in a dependencies
    // block - this only affects strategy.
    // See http://forums.gradle.org/gradle/topics/shouldnt-resolutionstrategy-affect-depending-projects-transitive-dependencies
    resolutionStrategy {
      failOnVersionConflict()
      force "com.google.inject:guice:${guiceRev}"
      // Guice 6 extensions require 2.18.0; Guava 31 also requests the older 2.7.1.
      force 'com.google.errorprone:error_prone_annotations:2.18.0'
      force "org.apache.httpcomponents:httpclient:${httpclientRev}"
      force "org.apache.httpcomponents:httpcore:${httpcoreRev}"
      force "com.fasterxml.jackson.core:jackson-annotations:${jacksonRev}"
      force "com.fasterxml.jackson.core:jackson-core:${jacksonRev}"
      force "com.google.code.gson:gson:${gsonRev}"
      force "com.google.guava:guava:${guavaRev}"
      force "com.google.protobuf:protobuf-java:${protobufRev}"
      force "io.netty:netty-handler:${nettyRev}"
      force "junit:junit:${junitRev}"
      force "org.apache.thrift:libthrift:${thriftRev}"
      force "org.apache.zookeeper:zookeeper:${zookeeperRev}"
      force "org.hamcrest:hamcrest-core:1.3"
      // Match EasyMock 5.6's class-instantiation dependency.
      force 'org.objenesis:objenesis:3.4'
      force "org.slf4j:slf4j-api:${slf4jRev}"
    }
  }
}

/**
 * This gradle project contains the logic to bootstrap and build the UI bundle using NodeJS.
 * The core logic of UI building is delegated to npm and Webpack. Webpack writes the UI bundle
 * into the resources directory of the Scheduler, so it must be built before the Scheduler.
 */
project(':ui') {
  // The original npm/webpack application remains part of the full build.
  // Node and npm must be installed by the developer; no obsolete Gradle Node plugin is loaded.
  tasks.register('pluginInstall', Exec) {
    workingDir projectDir
    commandLine 'npm', 'install', 'plugin/'
  }
  tasks.register('install', Exec) {
    dependsOn 'pluginInstall'
    workingDir projectDir
    commandLine 'npm', 'install'
  }
  tasks.register('lint', Exec) {
    dependsOn 'install'
    workingDir projectDir
    commandLine 'npm', 'run', 'lint'
  }
  tasks.register('npm_test', Exec) {
    dependsOn 'install'
    workingDir projectDir
    commandLine 'npm', 'test', '--', '--runInBand'
  }
  tasks.register('test_') { dependsOn 'npm_test' }
  tasks.register('webpack', Exec) {
    dependsOn 'install'
    workingDir projectDir
    inputs.files(fileTree('src'), fileTree('plugin'), file('webpack.config.js'))
    outputs.dir(rootProject.file('src/main/resources/scheduler/assets/js'))
    commandLine 'node', 'node_modules/.bin/webpack'
  }
  tasks.named('build') { dependsOn 'lint', 'webpack', 'npm_test' }
}
// Make sure UI webpack is run as part of 'processResources --continuous'. Also makes sure when
// building the Scheduler JAR, the JS bundle is built first.
tasks.processResources.dependsOn(':ui:webpack')

project(':commons') {
  // The original commons build required license checks. Keep that gate explicit
  // until the old license plugin is ported; a full build must not silently omit it.
  ['licenseMain', 'licenseTest'].each { taskName ->
    tasks.register(taskName) {
      group = 'verification'
      doLast {
        throw new GradleException("${path}: original license integration awaits Gradle 9 port")
      }
    }
  }
  tasks.named('check') { dependsOn 'licenseMain', 'licenseTest' }

  dependencies {
    api "com.google.code.gson:gson:${gsonRev}"
    api "com.google.guava:guava:${guavaRev}"
    api "com.google.inject:guice:${guiceRev}"
    api "commons-lang:commons-lang:${commonsLangRev}"
    api "javax.servlet:javax.servlet-api:${servletRev}"
    api "javax.ws.rs:javax.ws.rs-api:${jaxRsRev}"
    api "org.antlr:stringtemplate:${stringTemplateRev}"
    api "org.apache.zookeeper:zookeeper:${zookeeperRev}"
    api "org.easymock:easymock:5.6.0"

    // There are a few testing support libs in the src/main/java trees that use junit - currently:
    //   src/main/java/org/apache/aurora/common/zookeeper/testing
    //   src/main/java/org/apache/aurora/common/testing
    api "junit:junit:${junitRev}"

    testImplementation "junit:junit:${junitRev}"
  }
}

project(':api') {
  apply plugin: org.apache.aurora.build.ThriftPlugin
  apply plugin: org.apache.aurora.build.ThriftEntitiesPlugin

  tasks.withType(Jar) {
    archiveBaseName = "aurora-api"
  }

  publishing {
    publications {
      mavenJava(MavenPublication) {
        from components.java

        artifactId = "aurora-api"

        artifact sourceJar {
          archiveClassifier = "sources"
        }
      }
    }
  }

  thrift {
    version = thriftRev
    resourcePrefix = 'org/apache/aurora/scheduler/gen/client'
  }

  thriftEntities {
    gsonRev = project.gsonRev
    guavaRev = project.guavaRev
    inputFiles = fileTree("src/main/thrift/org/apache/aurora/gen").matching {
      include "**/*.thrift"
    }
  }

  idea {
    module {
      [thrift.genJavaDir, thriftEntities.genJavaDir].each {
        sourceDirs += it
        generatedSourceDirs += it
      }

      // These directories must exist, else the plugin omits them from the
      // generated project. Since this is executed during the configuration
      // lifecycle phase, dependency tasks have not yet run and created
      // the directories themselves.
      // By default, the idea module [1] excludes are set to
      // [project.buildDir, project.file('.gradle')]
      // This has the side-effect of also excluding our generated sources [2].  Due to the way
      // directory exclusion works in idea, you can't exclude a directory and include a child of that
      // directory. Clearing the excludes seems to have no ill side-effects, making it preferable to
      // other possible approaches.
      //
      // [1] http://www.gradle.org/docs/current/dsl/org.gradle.plugins.ide.idea.model.IdeaModule.html
      // [2] http://issues.gradle.org/browse/GRADLE-1174
      excludeDirs = [file(".gradle")]
      [
          "classes",
          "dependency-cache",
          "docs",
          "jacoco",
          "reports",
          "test-results",
          "tmp"
      ].each {
        excludeDirs << file("$buildDir/$it")
      }
    }
  }
}

def generatedDir = "$buildDir/generated-src"
def httpAssetsPath = 'scheduler/assets'

compileJava {
  options.compilerArgs << '-Werror'
  options.compilerArgs << '-Xlint:all'
  // Apache license headers use /** before package declarations in the original source.
  options.compilerArgs << '-Xlint:-dangling-doc-comments'
  options.compilerArgs.addAll(['-Xmaxwarns', '1000'])
  // Don't fail for annotations not claimed by annotation processors.
  options.compilerArgs << '-Xlint:-processing'
  // Don't fail for serialVersionUID warnings.
  options.compilerArgs << '-Xlint:-serial'
  // Capture method parameter names in classfiles.
  options.compilerArgs << '-parameters'
}

task enforceVersion {
  def foundVersion = JavaVersion.current();
  if (foundVersion < minJavaVersion) {
    throw new GradleException("Build requires at least Java ${minJavaVersion}; but ${foundVersion}"
        + " was found. Consider setting JAVA_HOME to select a specific JDK on your system.");
  }
}

compileJava.dependsOn(enforceVersion);

tasks.named('wrapper') { gradleVersion = '9.7.1' }

// TODO(ksweeney): Consider pushing this down to API - the scheduler implementation itself should
// only be consumed as an application.
publishing {
  publications {
    mavenJava(MavenPublication) {
      from components.java

      artifactId = 'aurora-scheduler'

      artifact sourceJar {
        archiveClassifier = "sources"
      }
    }
  }
}

task generateBuildProperties (type:Exec) {
  def outputDir = file("${buildDir}/build-properties")
  def outputFile = file("${outputDir}/build.properties")
  outputs.upToDateWhen { false }
  outputs.dir outputDir
  doFirst {
    outputDir.exists() || outputDir.mkdirs()
  }

  commandLine "${projectDir}/build-support/generate-build-properties", "${outputFile}"
}

sourceSets {
  main {
    output.dir generateBuildProperties
    resources {
      srcDir '3rdparty/javascript'
    }
  }
}

dependencies {
  def shiroRev = '1.4.0'
  def jettyDep = '9.3.11.v20160721'

  api project(':api')
  api project(':commons')

  api 'aopalliance:aopalliance:1.0'
  api "ch.qos.logback:logback-classic:${logbackRev}"
  api "com.beust:jcommander:1.72"
  api "com.google.inject:guice:${guiceRev}"
  api "com.google.inject.extensions:guice-assistedinject:${guiceRev}"
  api "com.google.inject.extensions:guice-servlet:${guiceRev}"
  api "com.google.protobuf:protobuf-java:${protobufRev}"
  api 'com.hubspot.jackson:jackson-datatype-protobuf:0.9.3'
  api "com.fasterxml.jackson.core:jackson-core:${jacksonRev}"
  api "org.jboss.resteasy:resteasy-guice:${resteasyRev}"
  api "org.jboss.resteasy:resteasy-jackson-provider:${resteasyRev}"
  api "org.jboss.resteasy:resteasy-jaxrs:${resteasyRev}"
  // The existing Jackson/JAX-RS error provider needs annotations no longer bundled with the JDK.
  runtimeOnly 'javax.xml.bind:jaxb-api:2.3.1'
  api 'javax.inject:javax.inject:1'
  api "javax.servlet:javax.servlet-api:${servletRev}"
  api "org.antlr:stringtemplate:${stringTemplateRev}"
  api "org.apache.curator:curator-client:${curatorRev}"
  api "org.apache.curator:curator-framework:${curatorRev}"
  api "org.apache.curator:curator-recipes:${curatorRev}"
  api 'org.apache.mesos:mesos:1.6.1'
  api "org.asynchttpclient:async-http-client:${asyncHttpclientRev}"
  api "org.apache.shiro:shiro-guice:${shiroRev}"
  api "org.apache.shiro:shiro-web:${shiroRev}"
  api "org.apache.zookeeper:zookeeper:${zookeeperRev}"
  api "org.eclipse.jetty:jetty-rewrite:${jettyDep}"
  api "org.eclipse.jetty:jetty-server:${jettyDep}"
  api "org.eclipse.jetty:jetty-servlet:${jettyDep}"
  api "org.eclipse.jetty:jetty-servlets:${jettyDep}"
  api 'org.quartz-scheduler:quartz:2.2.2'

  testImplementation 'com.sun.jersey:jersey-client:1.19'
  testImplementation "junit:junit:${junitRev}"
  testImplementation "org.powermock:powermock-module-junit4:1.6.4"
  testImplementation "org.powermock:powermock-api-easymock:1.6.4"
}

// Preserve quality entrypoints, with explicit failures for integrations not yet ported.
// The bounded Java 25 baseline does not claim these old analyzers understand Java 25.
def runCodeQuality = project.hasProperty('q')
tasks.withType(Checkstyle).configureEach { enabled = runCodeQuality }
tasks.withType(Pmd).configureEach { enabled = runCodeQuality }
checkstyle { toolVersion = '7.3' }
pmd {
  toolVersion = '5.5.3'
  consoleOutput = true
}
tasks.named('pmdMain') { ruleSetFiles = files('config/pmd/common.xml', 'config/pmd/main.xml') }
tasks.named('pmdTest') { ruleSetFiles = files('config/pmd/common.xml', 'config/pmd/test.xml') }
['spotbugsMain', 'spotbugsTest', 'licenseMain', 'licenseTest'].each { taskName ->
  tasks.register(taskName) {
    group = 'verification'
    doLast { throw new GradleException("${taskName}: original quality integration awaits Java 25/Gradle 9 port") }
  }
}
if (runCodeQuality) {
  tasks.named('check') { dependsOn 'spotbugsMain', 'spotbugsTest', 'licenseMain', 'licenseTest' }
}

// Compile every original test class; Java compilation does not need the UI bundle.
tasks.named('compileTestJava') {
  classpath = files(sourceSets.main.output.classesDirs, configurations.testCompileClasspath)
}
tasks.register('processJavaResources', Copy) {
  from sourceSets.main.resources
  from tasks.named('generateBuildProperties')
  into layout.buildDirectory.dir('java-resources')
}
tasks.register('focusedTest', Test) {
  description = 'Run selected original scheduler tests without UI or full-suite coverage gates.'
  group = 'verification'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = files(sourceSets.test.output, sourceSets.main.output.classesDirs,
      tasks.named('processJavaResources'), configurations.testRuntimeClasspath)
  jacoco.enabled = false
}

idea {
  project {
    vcs = 'Git'
    jdkName = '25'
    languageLevel = '25'

  }
}

// Modern IntelliJ imports this Gradle model directly. The old .ipr/.iml XML
// mutation APIs are deprecated in Gradle 9; generated API roots are mapped above.

// Configuration parameters for the application plugin.
application {
  applicationName = 'aurora-scheduler'
  mainClass = 'org.apache.aurora.scheduler.app.SchedulerMain'
}

jacoco { toolVersion = '0.8.14' }

def reportPath = "$buildDir/reports/jacoco/test"
jacocoTestReport {
  group = "Reporting"
  description = "Generate Jacoco coverage reports after running tests."

  sourceDirectories.from(sourceSets.main.java.srcDirs)
  classDirectories.from(sourceSets.main.output.classesDirs)
  reports {
    xml.required = true
  }
  doLast {
    println "Coverage report generated: file://$reportPath/html/index.html"
  }
}
test.finalizedBy jacocoTestReport

jacocoTestCoverageVerification {
  violationRules {
    rule {
      limit {
        counter = 'INSTRUCTION'
        minimum = 0.87
      }
    }
    rule {
      limit {
        counter = 'BRANCH'
        minimum = 0.79
      }
    }
  }
}
jacocoTestReport.finalizedBy jacocoTestCoverageVerification

// Qualify the complete original Java suite before backend extraction. Keep UI/distribution
// qualification in the full build, and retain focusedTest for selected, uninstrumented tests.
def behaviorTest = tasks.register('behaviorTest', Test) {
  description = 'Run all original scheduler Java tests with coverage, independently of UI packaging.'
  group = 'verification'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = files(sourceSets.test.output, sourceSets.main.output.classesDirs,
      tasks.named('processJavaResources'), configurations.testRuntimeClasspath)
  doFirst {
    if (!filter.commandLineIncludePatterns.empty || !filter.includePatterns.empty
        || !filter.excludePatterns.empty || !includes.empty || !excludes.empty) {
      throw new GradleException('behaviorTest requires the complete suite; use focusedTest for filters')
    }
  }
}

def behaviorCoverageReport = tasks.register('behaviorCoverageReport', JacocoReport) {
  description = 'Report coverage of the original application classes from behaviorTest.'
  group = 'verification'
  dependsOn behaviorTest
  executionData behaviorTest.map { it.jacoco.destinationFile }
  sourceDirectories.setFrom(sourceSets.main.java.srcDirs)
  classDirectories.setFrom(sourceSets.main.output.classesDirs)
  reports {
    xml.required = true
    html.required = true
  }
}

def behaviorCoverageVerification = tasks.register(
    'behaviorCoverageVerification', JacocoCoverageVerification) {
  description = 'Enforce the historical coverage thresholds on the original application.'
  group = 'verification'
  dependsOn behaviorCoverageReport
  executionData behaviorTest.map { it.jacoco.destinationFile }
  sourceDirectories.setFrom(sourceSets.main.java.srcDirs)
  classDirectories.setFrom(sourceSets.main.output.classesDirs)
  violationRules {
    rule {
      limit {
        counter = 'INSTRUCTION'
        minimum = 0.87
      }
      limit {
        counter = 'BRANCH'
        minimum = 0.79
      }
    }
  }
}

def commonsBehaviorTest = project(':commons').tasks.named('test')
tasks.register('verifyOriginalBehavior') {
  description = 'Run original Java behavior and commons suites and enforce application coverage.'
  group = 'verification'
  dependsOn behaviorCoverageVerification, commonsBehaviorTest
  doLast {
    def requiredTasks = [behaviorTest.get(), behaviorCoverageReport.get(),
        behaviorCoverageVerification.get(), commonsBehaviorTest.get()]
    requiredTasks.each { requiredTask ->
      def state = requiredTask.state
      if (!requiredTask.enabled || !state.executed
          || (state.skipped && !(state.skipMessage in ['UP-TO-DATE', 'FROM-CACHE']))) {
        throw new GradleException("Original behavior qualification requires ${requiredTask.path}; "
            + "it was excluded, disabled or skipped")
      }
    }
    // JaCoCo skips its task when execution data is absent; that must not pass this gate.
    def report = behaviorCoverageReport.get().reports.xml.outputLocation.get().asFile
    if (!behaviorTest.get().jacoco.destinationFile.isFile() || !report.isFile()) {
      throw new GradleException('Original behavior qualification requires coverage data and an XML report')
    }
  }
}

// Keep the complete original benchmark source set without the obsolete JMH plugin.
sourceSets {
  jmh {
    compileClasspath += sourceSets.main.output + sourceSets.test.output
    runtimeClasspath += sourceSets.main.output + sourceSets.test.output
  }
}
configurations.jmhImplementation.extendsFrom(configurations.testImplementation)
configurations.jmhRuntimeOnly.extendsFrom(configurations.testRuntimeOnly)
dependencies {
  jmhImplementation 'org.openjdk.jmh:jmh-core:1.15'
  jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.15'
}
tasks.register('jmh', JavaExec) {
  group = 'benchmark'
  classpath = sourceSets.jmh.runtimeClasspath
  mainClass = 'org.openjdk.jmh.Main'
  maxHeapSize = '512m'
  doFirst { layout.buildDirectory.dir('reports/jmh').get().asFile.mkdirs() }
  args '-prof', 'gc', '-prof', 'stack'
  args '-o', layout.buildDirectory.file('reports/jmh/human.txt').get().asFile.path
  if (project.hasProperty('benchmarks')) { args project.property('benchmarks') }
  args '-rff', layout.buildDirectory.file('reports/jmh/results.txt').get().asFile.path
}

run {
  mainClass = 'org.apache.aurora.scheduler.app.local.LocalSchedulerMain'
  classpath += sourceSets.test.output
}

startScripts {
  def environmentClasspathPrefix = System.env.CLASSPATH_PREFIX

  if (!environmentClasspathPrefix?.trim()) {
    return
  }

  doLast {
    unixScript.text = unixScript.text.replace('CLASSPATH=', "CLASSPATH=${environmentClasspathPrefix}:")
  }
}

// Include a script to run the recovery tool.
task moreStartScripts(type: CreateStartScripts) {
  mainClass = 'org.apache.aurora.scheduler.storage.durability.RecoveryTool'
  applicationName = 'recovery-tool'
  outputDir = new File(project.buildDir, 'scripts')
  classpath = jar.outputs.files + project.configurations.runtimeClasspath
}

distributions.main.contents.into('bin') {
  from(moreStartScripts)
  filePermissions { unix(0755) }
}
