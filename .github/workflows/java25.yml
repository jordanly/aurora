name: Original Aurora on Java 25

on:
  pull_request:
  push:
    branches: [master, codex/in-place-java25]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java25-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-agent:
    name: Go agent / tests and provenance
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check and build pinned Go integration binaries
        run: |
          mkdir -p .cache/inplace-go
          if ! build-support/lab/build-agents --check >.cache/inplace-go/build-agents.log 2>&1; then
            tail -c 3000 .cache/inplace-go/build-agents.log
            exit 1
          fi
      - name: Build the standalone Go client
        run: build-support/bootstrap-go build-client --output "$PWD/.cache/inplace-go/aurora"
      - name: Retain Go checks and provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java25-go-agent
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .cache/inplace-go/build-agents.log
            .cache/inplace-go/aurora
            .cache/inplace-go/aurora.provenance.json
            .pi-tools/agent-original-integration/*.provenance.json
  verify:
    name: Java 25 / ${{ matrix.gate }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        gate: [behavior-and-distribution, quality]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install compiler build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential bison flex libboost-dev
      - name: Build the pinned Thrift compiler
        id: thrift
        run: |
          mkdir -p .cache/inplace-thrift
          if ! compiler="$(build-support/bootstrap-go thrift 2>.cache/inplace-thrift/bootstrap.log)"; then
            tail -c 3000 .cache/inplace-thrift/bootstrap.log
            exit 1
          fi
          echo "compiler=$compiler" >> "$GITHUB_OUTPUT"
      - name: Verify build helpers and code generation contracts
        run: build-support/bootstrap-go check-tools
      - name: Verify original behavior, UI, and installed launchers
        if: matrix.gate == 'behavior-and-distribution'
        env:
          THRIFT_COMPILER: ${{ steps.thrift.outputs.compiler }}
        run: |
          ./gradlew "-PthriftCompiler=$THRIFT_COMPILER" \
            verifyOriginalBehavior :ui:build verifyInstalledDistribution --continue
      - name: Run the original optional quality gates explicitly
        if: matrix.gate == 'quality'
        env:
          THRIFT_COMPILER: ${{ steps.thrift.outputs.compiler }}
        run: |
          ./gradlew "-PthriftCompiler=$THRIFT_COMPILER" -Pq \
            verifyOriginalQuality --continue
      - name: Retain reports for passing and failing gates
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java25-${{ matrix.gate }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .cache/inplace-thrift/bootstrap.log
            .cache/inplace-thrift/compiler-receipt.json
            .cache/inplace-build/build/**/reports/**
            .cache/inplace-build/build/**/test-results/**
            .cache/inplace-build/build/**/distribution-verification.json
