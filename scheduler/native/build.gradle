apply plugin: 'java'
apply plugin: 'application'
sourceCompatibility = 1.8
targetCompatibility = 1.8
if (project.hasProperty('nativeBuildRoot')) {
  def outputRoot = new File(project.property('nativeBuildRoot').toString())
  if (!outputRoot.isAbsolute()) {
    throw new GradleException('nativeBuildRoot must be absolute')
  }
  buildDir = new File(outputRoot, 'scheduler')
} else {
  buildDir = file('../../.pi-tools/native-scheduler-dist')
}
repositories { mavenCentral() }
dependencies {
  implementation project(':protocol')
  implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.4'
  implementation 'org.xerial:sqlite-jdbc:3.53.4.0'
  testImplementation 'junit:junit:4.13.2'
}
sourceSets.main.java {
  srcDir '../../src/main/java'
  include 'org/apache/aurora/nativescheduler/**'
  include 'org/apache/aurora/scheduler/storage/sql/**'
}
mainClassName = 'org.apache.aurora.nativescheduler.NativeSchedulerMain'
test {
  maxParallelForks = 1
  systemProperty 'aurora.fixtures', file('../../protocol/native-v1alpha1/fixtures').absolutePath
}
installDist.dependsOn ':protocol:verifyRuntimeArtifacts'

sourceSets.test.java {
  srcDir '../../src/test/java'
  include 'org/apache/aurora/nativescheduler/**'
  include 'org/apache/aurora/scheduler/storage/sql/**'
}
task verifyJdbcArtifact {
  inputs.files configurations.runtimeClasspath
  doLast {
    def jdbc = configurations.runtimeClasspath.find { it.name == 'sqlite-jdbc-3.53.4.0.jar' }
    if (jdbc == null || java.security.MessageDigest.getInstance('SHA-256').digest(jdbc.bytes).encodeHex().toString()
        != 'bcb1f51e36f940867e83342f9efbf5968ac44a6bef4d397bb4af7b17b45cd2fb') {
      throw new GradleException('SQLite JDBC artifact checksum mismatch')
    }
  }
}
test.dependsOn verifyJdbcArtifact, ':protocol:verifyRuntimeArtifacts'
installDist.dependsOn verifyJdbcArtifact

// Qualification-only CLI remains in test classes, never in the production runtime.
jar { exclude 'org/apache/aurora/scheduler/storage/sql/NativeStoreTool*' }

// Verify built JAR contents before tests, and verify the actual copied lib directory
// at the end of installDist. Neither gate invokes the legacy root project.
def boundaryTool = file('../../build-support/native/verify-boundary')
task stageBoundaryRuntime(type: Sync, dependsOn: jar) {
  from configurations.runtimeClasspath
  from jar.archivePath
  into "$buildDir/boundary/lib"
}
task verifyNativeBoundary(type: Exec, dependsOn: stageBoundaryRuntime) {
  inputs.file boundaryTool
  inputs.files configurations.runtimeClasspath, jar.archivePath
  commandLine 'python3', boundaryTool.absolutePath,
      '--lib-dir', file("$buildDir/boundary/lib").absolutePath,
      '--report', file("$buildDir/reports/native-runtime.json").absolutePath,
      '--profile', 'scheduler'
}
check.dependsOn verifyNativeBoundary
test.dependsOn verifyNativeBoundary
installDist.dependsOn verifyNativeBoundary
installDist.doLast {
  exec {
    commandLine 'python3', boundaryTool.absolutePath,
        '--lib-dir', new File(installDist.destinationDir, 'lib').absolutePath,
        '--report', file("$buildDir/reports/installed-native-runtime.json").absolutePath,
        '--profile', 'scheduler'
  }
}
